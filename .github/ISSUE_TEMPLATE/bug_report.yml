name: Bug report
description: Something isn't working? Let's make it reproducible.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For security issues, use private vulnerability reporting. Never paste credentials or private environment files."
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Commit or version, Node version, browser, and hosting provider."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, emails, and other private data first.
